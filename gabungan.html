                    <div class="mt-4 flex gap-2 w-full">

        function showNotification(message, type) {
            const toast = document.getElementById('toastNotification');
            toast.innerText = message;
            toast.style.backgroundColor = type === 'success' ? '#10B981' : (type === 'warning' ? '#F59E0B' : '#EF4444');
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        // Beep Sound
        function playBeep(success = true) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.setValueAtTime(success ? 600 : 300, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        // Barcode Scanner Controls (QuaggaJS)
        function startScanner() {
            if (isScanning) return;
            Quagga.init({
                inputStream : {
                    name : "Live",
                    type : "LiveStream",
                    target: document.querySelector('#interactive'),
                    constraints: { facingMode: "environment" },
                },
                decoder : {
                    readers : ["code_128_reader", "ean_reader", "ean_8_reader", "code_39_reader"]
                },
                locate: true
            }, function(err) {
                if (err) {
                    showNotification("Gagal mengaktifkan kamera scanner.", "error");
                    return;
                }
                Quagga.start();
                isScanning = true;
                document.getElementById('startScanBtn').classList.add('hidden');
                document.getElementById('stopScanBtn').classList.remove('hidden');
            });
            Quagga.onDetected(onBarcodeDetected);
        }

        function stopScanner() {
            if (isScanning) {
                Quagga.stop();
                Quagga.offDetected(onBarcodeDetected);
                isScanning = false;
                document.getElementById('startScanBtn').classList.remove('hidden');
                document.getElementById('stopScanBtn').classList.add('hidden');
            }
        }

        function onBarcodeDetected(result) {
            const code = result.codeResult.code;
            const currentTime = Date.now();
            if (code === lastScannedCode && (currentTime - lastScannedTime) < COOLDOWN_TIME) return;

            lastScannedCode = code;
            lastScannedTime = currentTime;
            processAttendance(code);
        }

        function processAttendance(codeText) {
            let nama = "";
            let kelas = "";

            try {
                const data = JSON.parse(codeText);
                nama = data.nama;
                kelas = data.kelas;
            } catch (e) {
                // Cari apakah teks barcode cocok dengan nama/format kartu siswa yang di-generate
                const found = studentsData.find(s => codeText.includes(s.NAMA));
                if (found) {
                    nama = found.NAMA;
                    kelas = found.KELAS;
                } else {
                    nama = "Siswa (" + codeText + ")";
                    kelas = "Umum";
                }
            }

            const sudahAbsen = absensiList.some(item => item.nama === nama);
            if (sudahAbsen) {
                showNotification(`⚠️ ${nama} sudah absen sebelumnya!`, "warning");
                playBeep(false);
            } else {
                const waktu = new Date().toLocaleTimeString('id-ID');
                const tanggal = new Date().toLocaleDateString('id-ID');
                absensiList.unshift({ nama, kelas, waktu, tanggal });
                localStorage.setItem('absensi_dhuha_combined', JSON.stringify(absensiList));
                updateAbsenTable();
                showNotification(`✅ Berhasil: ${nama} (${kelas})`, "success");
                playBeep(true);
            }
        }

        // Update Absensi Table
        function updateAbsenTable() {
            const tbody = document.getElementById('attendanceTableBody');
            tbody.innerHTML = '';
            if (absensiList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400">Belum ada data absensi hari ini.</td></tr>`;
                document.getElementById('totalHadir').innerText = '0';
                return;
            }

            absensiList.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                tr.innerHTML = `
                    <td class="p-3 text-slate-500">${index + 1}</td>
                    <td class="p-3 font-medium text-slate-800">${item.nama}</td>
                    <td class="p-3 text-slate-600"><span class="bg-slate-100 px-2.5 py-1 rounded-md text-xs font-semibold">${item.kelas}</span></td>
                    <td class="p-3 text-slate-600">${item.waktu}</td>
                    <td class="p-3 text-center">
                        <button onclick="hapusItem(${index})" class="text-rose-500 hover:text-rose-700 text-xs font-medium px-2 py-1 bg-rose-50 hover:bg-rose-100 rounded-md transition">Hapus</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            document.getElementById('totalHadir').innerText = absensiList.length;
        }

        function hapusItem(index) {
            if (confirm("Hapus data siswa ini?")) {
                absensiList.splice(index, 1);
                localStorage.setItem('absensi_dhuha_combined', JSON.stringify(absensiList));
                updateAbsenTable();
                showNotification("Data dihapus", "warning");
            }
        }

        function resetAbsensi() {
            if (confirm("Reset seluruh data absensi hari ini?")) {
                absensiList = [];
                localStorage.removeItem('absensi_dhuha_combined');
                updateAbsenTable();
                showNotification("Data dikosongkan", "warning");
            }
        }

        function filterAbsenTable() {
            const keyword = document.getElementById('searchInputAbsen').value.toLowerCase();
            const rows = document.getElementById('attendanceTableBody').getElementsByTagName('tr');
            for (let i = 0; i < rows.length; i++) {
                const row = rows[i];
                if (row.cells.length < 5) continue;
                const text = row.cells[1].innerText.toLowerCase() + " " + row.cells[2].innerText.toLowerCase();
                row.style.display = text.includes(keyword) ? "" : "none";
            }
        }

        function exportToExcel() {
            if (absensiList.length === 0) {
                showNotification("Belum ada data untuk di-export!", "warning");
                return;
            }
            const dataToExport = absensiList.map((item, idx) => ({
                "No": idx + 1, "Nama Siswa": item.nama, "Kelas": item.kelas, "Waktu Scan": item.waktu, "Tanggal": item.tanggal
            }));
            const worksheet = XLSX.utils.json_to_sheet(dataToExport);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Absensi");
            XLSX.writeFile(workbook, `Rekap_Absensi_Dhuha_${new Date().toISOString().slice(0,10)}.xlsx`);
            showNotification("File Excel berhasil di-download!", "success");
        }

        // Generator Barcode Functions
        function filterClass(cls) {
            selectedClass = cls;
            document.querySelectorAll('.class-btn').forEach(btn => {
                btn.classList.remove('bg-emerald-600', 'text-white');
                btn.classList.add('bg-slate-100', 'text-slate-600');
            });
            document.getElementById(`btn-${cls}`).classList.remove('bg-slate-100', 'text-slate-600');
            document.getElementById(`btn-${cls}`).classList.add('bg-emerald-600', 'text-white');
            renderBarcodes();
        }

        function renderBarcodes() {
            const container = document.getElementById('barcodeContainer');
            container.innerHTML = '';
            const keyword = document.getElementById('searchInputGen').value.toLowerCase();

            const filtered = studentsData.filter(student => {
                const matchClass = (selectedClass === 'ALL' || student.KELAS === selectedClass);
                const matchName = student.NAMA.toLowerCase().includes(keyword);
                return matchClass && matchName;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400">Tidak ada siswa ditemukan.</div>`;
                return;
            }

            filtered.forEach(student => {
                const barcodeValue = `${student.NAMA} (${student.KELAS})`;
                const uniqueId = `bc-${student.NO}-${student.KELAS.replace(/\s+/g, '')}`;

                const card = document.createElement('div');
                card.className = "barcode-card bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-between text-center";
                card.innerHTML = `
                    <div class="w-full mb-2">
                        <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2.5 py-1 rounded-md">${student.KELAS}</span>
                        <h3 class="font-bold text-slate-800 text-sm mt-2 uppercase truncate" title="${student.NAMA}">${student.NO}. ${student.NAMA}</h3>
                    </div>
                    <div class="my-2 bg-slate-50 p-2 rounded-lg w-full flex justify-center">
                        <svg id="${uniqueId}"></svg>
                    </div>
                    <div class="text-[10px] text-slate-400 font-mono mt-1">ID: ${student.KELAS}-${student.NO}</div>
                `;
                container.appendChild(card);

                try {
                    JsBarcode(`#${uniqueId}`, barcodeValue, {
                        format: "CODE128",
                        lineColor: "#1e293b",
                        width: 1.5,
                        height: 45,
                        displayValue: true,
                        fontSize: 11,
                        margin: 2
                    });
                } catch (e) {}
            });
        }

        // Inisialisasi awal
        window.onload = function() {
            updateAbsenTable();
            setTimeout(startScanner, 800);
        };
    </script>
</body>
</html>
