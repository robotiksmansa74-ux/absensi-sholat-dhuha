        let selectedClass = 'ALL';

        function filterClass(cls) {
            selectedClass = cls;
            document.querySelectorAll('.class-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white');
                btn.classList.add('bg-slate-100', 'text-slate-600');
            });
            const activeBtn = document.getElementById(`btn-${cls}`);
            activeBtn.classList.remove('bg-slate-100', 'text-slate-600');
            activeBtn.classList.add('bg-indigo-600', 'text-white');
            renderBarcodes();
        }

        function renderBarcodes() {
            const container = document.getElementById('barcodeContainer');
            container.innerHTML = '';

            const keyword = document.getElementById('searchInput').value.toLowerCase();

            const filtered = studentsData.filter(student => {
                const matchClass = (selectedClass === 'ALL' || student.KELAS === selectedClass);
                const matchName = student.NAMA.toLowerCase().includes(keyword);
                return matchClass && matchName;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400">Tidak ada siswa yang ditemukan.</div>`;
                return;
            }

            filtered.forEach(student => {
                // Buat kode unik barcode (bisa berupa kombinasi atau JSON string sederhana yang disukai scanner barcode)
                // Format teks unik untuk barcode: Nama + Kelas (atau ID unik)
                // Karena barcode linear cocok untuk string teks pendek / angka, kita buat format: S-[NO]-[KELAS] atau Nama
                const barcodeValue = `${student.NAMA} (${student.KELAS})`;
                const uniqueId = `barcode-${student.NO}-${student.KELAS.replace(/\s+/g, '')}`;

                const card = document.createElement('div');
                card.className = "barcode-card bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-between text-center";
                card.innerHTML = `
                    <div class="w-full mb-2">
                        <span class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md">${student.KELAS}</span>
                        <h3 class="font-bold text-slate-800 text-sm mt-2 uppercase tracking-wide truncate" title="${student.NAMA}">${student.NO}. ${student.NAMA}</h3>
                    </div>
                    <div class="my-2 bg-slate-50 p-2 rounded-lg w-full flex justify-center">
                        <svg id="${uniqueId}"></svg>
                    </div>
                    <div class="text-[10px] text-slate-400 font-mono mt-1">ID: ${student.KELAS}-${student.NO}</div>
                `;
                container.appendChild(card);

                // Render Barcode menggunakan JsBarcode
                try {
                    JsBarcode(`#${uniqueId}`, barcodeValue, {
                        format: "CODE128",
                        lineColor: "#1e293b",
                        width: 1.5,
                        height: 45,
                        displayValue: true,
                        fontSize: 11,
                        margin: 2
                    });
                } catch (e) {
                    console.error("Gagal render barcode untuk:", student.NAMA);
                }
            });
        }

        // Jalankan saat pertama kali dimuat
        window.onload = function() {
            renderBarcodes();
