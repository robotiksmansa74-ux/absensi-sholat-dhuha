    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        @media print {
            body { background: white !important; }
            no-print, header, .no-print { display: none !important; }
            .print-container { display: grid !important; }
            .qr-card-print {
                break-inside: avoid;
                page-break-inside: avoid;
                border: 1px solid #cbd5e1 !important;
                box-shadow: none !important;
            }
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #22c55e; border-radius: 3px; }
    </style>

<body class="bg-gradient-to-br from-slate-50 via-green-50/30 to-slate-100 min-h-screen text-slate-800">

    <header class="no-print bg-green-900 text-white shadow-xl sticky top-0 z-50 backdrop-blur-md bg-opacity-95">

                    <i class="fa-solid fa-print"></i> Cetak Kartu Massal (A4)

    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        
        <!-- Toast Notification Area -->

        <!-- Filters & Search Toolbar -->
        <div class="no-print bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5">Cari Nama Siswa</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i class="fa-solid fa-magnifying-glass text-xs"></i>
                        </span>
                        <input type="text" id="searchInput" oninput="filterAndRenderStudents()" placeholder="Ketik nama siswa..." class="w-full pl-9 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-green-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5">Filter Kelas</label>
                    <select id="filterKelas" onchange="filterAndRenderStudents()" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-green-500">
                        <option value="ALL">Semua Kelas (135 Siswa)</option>

                        <option value="XII4">Kelas XII4</option>
                        <option value="XII5">Kelas XII5</option>
                        <option value="XII6">Kelas XII6</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <div class="w-full bg-green-50 border border-green-200 rounded-xl p-2.5 text-center">

                    </div>

            </div>
        </div>

        <!-- Student QR Cards Grid Container -->
        <div id="studentGridContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-16 bg-white rounded-2xl border border-slate-100 shadow-sm">

            </div>

            <p class="text-xs text-slate-400 mt-1">Coba sesuaikan kata kunci pencarian atau filter kelas.</p>
        </div>
    </main>

        // Toast Notification System
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            const bgCol = type === 'success' ? 'bg-green-900 border-green-700 text-white' : 'bg-rose-900 border-rose-700 text-white';
            const icon = type === 'success' ? 'fa-circle-check text-green-400' : 'fa-circle-xmark text-rose-400';

            toast.className = `${bgCol} px-4 py-3 rounded-2xl shadow-xl border flex items-center gap-3 text-xs font-medium pointer-events-auto transform translate-y-2 opacity-0 transition-all duration-300`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-base"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Filter and Render Students Grid
        function filterAndRenderStudents() {
            const container = document.getElementById('studentGridContainer');
            const emptyState = document.getElementById('emptyState');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const kelasFilter = document.getElementById('filterKelas').value;

            container.innerHTML = '';

            const filtered = rawStudentsData.filter(s => {
                const matchSearch = s.nama.toLowerCase().includes(searchVal);
                const matchKelas = kelasFilter === 'ALL' || s.kelas.toUpperCase() === kelasFilter.toUpperCase();
                return matchSearch && matchKelas;
            });

            document.getElementById('studentCountDisplay').innerText = filtered.length;

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach((student, index) => {
                const cardId = `qr_card_${index}`;
                const qrPayload = JSON.stringify({ nama: student.nama, kelas: student.kelas });

                const cardDiv = document.createElement('div');
                cardDiv.className = "qr-card-print bg-white rounded-2xl shadow-sm border border-slate-100 p-5 flex flex-col justify-between space-y-4 hover:shadow-md transition";
                cardDiv.innerHTML = `
                    <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                        <span class="text-xs font-bold px-2.5 py-1 rounded-lg bg-green-50 text-green-700 border border-green-100">Kelas ${student.kelas}</span>
                        <i class="fa-solid fa-mosque text-green-600"></i>
                    </div>
                    
                    <div class="flex flex-col items-center justify-center space-y-3 py-2">
                        <div id="${cardId}" class="bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm inline-block"></div>
                        <div class="text-center">
                            <h3 class="font-bold text-slate-800 text-sm tracking-tight">${student.nama}</h3>
                            <p class="text-xs text-slate-400 mt-0.5">ID Pelajar Presensi</p>
                        </div>
                    </div>

                    <div class="no-print pt-2 border-t border-slate-100 flex gap-2">
                        <button onclick='openModal(${JSON.stringify(student)})' class="flex-1 bg-slate-50 hover:bg-slate-100 text-slate-700 border border-slate-200 py-2 rounded-xl text-xs font-medium transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-eye text-green-600"></i> Lihat
                        </button>
                    </div>
                `;
                container.appendChild(cardDiv);

                // Generate QR Code using qrcode.js
                setTimeout(() => {
                    const el = document.getElementById(cardId);
                    if (el) {
                        el.innerHTML = '';
                        new QRCode(el, {
                            text: qrPayload,
                            width: 120,
                            height: 120,
                            colorDark: "#14532d",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.M
                        });
                    }
                }, 10);
            });
        }

        // Modal Handlers
        let currentSelectedStudent = null;

        function openModal(student) {
            currentSelectedStudent = student;
            document.getElementById('modalStudentName').innerText = student.nama;
            document.getElementById('modalStudentClass').innerText = `Kelas: ${student.kelas}`;
            
            const box = document.getElementById('modalQrCodeBox');
            box.innerHTML = '';
            
            const qrPayload = JSON.stringify({ nama: student.nama, kelas: student.kelas });
            new QRCode(box, {
                text: qrPayload,
                width: 150,
                height: 150,
                colorDark: "#14532d",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });

            document.getElementById('singleCardModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('singleCardModal').classList.add('hidden');
        }

        function downloadCardImage() {
            if (!currentSelectedStudent) return;
            // Trigger browser print or save notification
            window.print();
        }
